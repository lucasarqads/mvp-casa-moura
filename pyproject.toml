[project]
name = "mvp-casa-moura"
version = "0.1.0"
description = "MVP Casa Moura — Gestão de Balcão (FastAPI + Tailwind CSS)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
