<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Casa Moura — Gestão de Balcão | Acesso</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4 font-sans antialiased">
  <main class="bg-white rounded-2xl shadow-lg p-8 w-full max-w-md border border-slate-200">
    <header>
      <div class="w-12 h-12 rounded-xl bg-amber-600 text-white font-bold text-xl flex items-center justify-center mx-auto mb-3" aria-hidden="true">CM</div>
      <h1 class="text-2xl font-bold text-slate-900 text-center">Casa Moura — Gestão de Balcão</h1>
      <p class="text-sm text-slate-600 text-center mt-1 mb-6">Acesso restrito a operadores autorizados</p>
    </header>

    <div id="alerta-erro" role="alert"
         class="hidden border border-red-300 bg-red-50 text-red-900 rounded-lg p-3.5 mb-5 items-start gap-2.5">
      <svg class="w-5 h-5 shrink-0 text-red-700 mt-px" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
        <line x1="12" y1="9" x2="12" y2="13"/>
        <line x1="12" y1="17" x2="12.01" y2="17"/>
      </svg>
      <p id="alerta-texto" class="text-sm font-medium"></p>
    </div>

    <form id="form-login" novalidate>
      <div class="mb-5">
        <label for="email" class="block text-sm font-semibold text-slate-900 mb-1.5">E-mail do Operador</label>
        <input id="email" name="email" type="email" autocomplete="username" required
               value="operador.balcao@casamoura-demo.local"
               class="min-h-[44px] w-full rounded-lg px-3.5 border-2 border-slate-400 text-slate-900 bg-white outline-none transition focus:ring-4 focus:ring-amber-500/40 focus:border-amber-600" />
      </div>

      <div class="mb-5">
        <label for="senha" class="block text-sm font-semibold text-slate-900 mb-1.5">Senha</label>
        <div class="relative">
          <input id="senha" name="senha" type="password" autocomplete="current-password" required
                 value="SenhaDemo123"
                 class="min-h-[44px] w-full rounded-lg pl-3.5 pr-24 border-2 border-slate-400 text-slate-900 bg-white outline-none transition focus:ring-4 focus:ring-amber-500/40 focus:border-amber-600" />
          <button type="button" id="toggle-senha" aria-controls="senha" aria-pressed="false" aria-label="Mostrar senha"
                  class="absolute right-1.5 top-1/2 -translate-y-1/2 min-h-[36px] px-3 text-xs font-semibold text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-md transition focus:outline-none focus:ring-2 focus:ring-amber-600">
            Mostrar
          </button>
        </div>
      </div>

      <button type="submit" id="btn-entrar"
              class="w-full min-h-[48px] mt-2 bg-slate-900 hover:bg-slate-800 text-white font-bold rounded-lg transition focus:outline-none focus:ring-4 focus:ring-amber-500 disabled:opacity-70 disabled:cursor-wait">
        Entrar no Sistema
      </button>
    </form>

    <p class="text-xs text-slate-600 text-center mt-6">Ambiente de demonstração — todos os dados são fictícios.</p>
  </main>

  <script>
    (function () {
      const $ = (id) => document.getElementById(id);
      const email = $('email'), senha = $('senha'), toggle = $('toggle-senha');
      const form = $('form-login'), botao = $('btn-entrar');
      const alerta = $('alerta-erro');
      const campos = [email, senha];

      function mostrarAlerta(texto, camposInvalidos) {
        $('alerta-texto').textContent = texto;
        alerta.classList.remove('hidden');
        alerta.classList.add('flex');
        campos.forEach((c) => {
          const invalido = camposInvalidos && campos.includes(c);
          c.setAttribute('aria-invalid', String(Boolean(invalido)));
          if (invalido) c.setAttribute('aria-describedby', 'alerta-texto');
        });
      }

      function ocultarAlerta() {
        alerta.classList.add('hidden');
        alerta.classList.remove('flex');
        campos.forEach((c) => { c.removeAttribute('aria-invalid'); c.removeAttribute('aria-describedby'); });
      }

      toggle.addEventListener('click', () => {
        const mostrando = senha.type === 'text';
        senha.type = mostrando ? 'password' : 'text';
        toggle.textContent = mostrando ? 'Mostrar' : 'Ocultar';
        toggle.setAttribute('aria-pressed', String(!mostrando));
        toggle.setAttribute('aria-label', mostrando ? 'Mostrar senha' : 'Ocultar senha');
      });

      if (new URLSearchParams(location.search).get('sessao') === 'expirada') {
        mostrarAlerta('Sua sessão expirou ou foi encerrada. Faça login novamente.', false);
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        ocultarAlerta();

        if (!email.value.trim() || !senha.value) {
          mostrarAlerta('Informe o e-mail e a senha para continuar.', true);
          (email.value.trim() ? senha : email).focus();
          return;
        }

        botao.disabled = true;
        botao.setAttribute('aria-busy', 'true');
        botao.textContent = 'Entrando…';

        try {
          const resposta = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email.value.trim(), senha: senha.value })
          });

          if (resposta.ok) {
            const dados = await resposta.json();
            sessionStorage.setItem('casamoura:token', dados.access_token);
            sessionStorage.setItem('casamoura:operador', dados.operador.nome);
            location.href = 'catalogo-checkout.html';
            return;
          }

          if (resposta.status === 401 || resposta.status === 422) {
            mostrarAlerta('Credenciais inválidas. Verifique o e-mail e a senha informados.', true);
            email.focus();
          } else {
            mostrarAlerta('Não foi possível entrar agora. Tente novamente em instantes.', false);
          }
        } catch {
          mostrarAlerta('Não foi possível conectar ao servidor. Verifique se a API está em execução.', false);
        } finally {
          botao.disabled = false;
          botao.removeAttribute('aria-busy');
          botao.textContent = 'Entrar no Sistema';
        }
      });
    })();
  </script>
</body>
</html>
